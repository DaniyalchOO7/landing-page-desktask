<style>

dl.fields{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:4px 14px;margin:8px 0;font-size:.95rem}dl.fields dt{color:var(--muted)}dl.fields dd{margin:0;overflow-wrap:anywhere}

function applyPattern(p,v){let t=(p||DEFPAT).replace(/\{(\w+)\}/g,(m,k)=>v[k]||'');t=t.replace(/[\\/:*?"<>|\u0000-\u001f]/g,' ');t=t.replace(/(\s*[-_,]\s*){2,}/g,' - ');return t.split(/\s+/).filter(Boolean).join(' ').replace(/^[ .\-_,]+|[ .\-_,]+$/g,'')}
function descName(c,d){const f=d.f||{},v={client:c.name,type:d.t,date:f.expiration_date||iso(d.rd),received:iso(d.rd),policy_number:f.policy_number||'',carrier:f.carrier||''};
 let stem=applyPattern(S.pattern,v).slice(0,120)||applyPattern(DEFPAT,v);return stem+(/\.jpe?g$/i.test(d.fn)?'.jpg':/\.png$/i.test(d.fn)?'.png':'.pdf')}
function noteText(c,d){const det=Object.entries(d.f||{}).map(([k,v])=>k.replace(/_/g,' ')+': '+v).join('; ');return `${d.t} for ${c.name}, received ${iso(d.rd)}.`+(det?' '+det+'.':'')}
const cell=v=>{v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function allRows(){return vclients().flatMap(([,c])=>c.docs.map(d=>({c,d}))).filter(x=>!S.onlyNew||(x.d.s==='Filed'&&!x.d.moved))}
function csvFor(items){const cols=[];const rows=items.map(({c,d})=>{const r={client:c.name,document:d.fn,type:d.t,status:d.s,confidence:d.c+'%',source:d.src,received:iso(d.rd),'moved to your system':d.moved?'yes':''};Object.entries(d.f||{}).forEach(([k,v])=>{if(!(k in r))r[k.replace(/_/g,' ')]=v});Object.keys(r).forEach(k=>{if(!cols.includes(k))cols.push(k)});return r});
 return [cols.map(cell).join(',')].concat(rows.map(r=>cols.map(k=>cell(r[k])).join(','))).join('\n')}
function copyTxt(id,btn){const el=document.getElementById(id),t=el.textContent,sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Press Ctrl+C'};
 try{navigator.clipboard.writeText(t).then(()=>{btn.textContent='Copied'},sel)}catch(e){sel()}}

 <h2>Sample data</h2><div class="card"><p style="margin-top:0" class="sub">Adds one clearly labeled sample client so you can try things out.</p><button class="btn ghost sm" onclick="loadSample()">Load sample client</button>${S.smsg?`<div class="note good" style="margin-top:10px">${esc(S.smsg)}</div>`:''}</div>
 <h2>What Deskfile did</h2><div class="card"><div class="seg"><button class="btn ghost sm" onclick="S.verified=verifyChain();draw()">Verify the log</button><button class="btn ghost sm" onclick="tamper()">${S.tamper?'Undo the tampering demo':'Simulate tampering'}</button></div>
 ${v?`<div class="note ${v.ok?'good':'err'}">${v.ok?`Log intact: ${v.n} entries, each linked to the one before.`:`Entry ${v.at} does not match its fingerprint. Something was changed after it was written.`}</div>`:''}
 <ul class="list">${S.chain.map((e,i)=>({e,i})).reverse().map(x=>`<li><span>${esc(x.e.m)}<br><span class="hash">${x.e.h}</span></span><span class="sub">${esc(x.e.t)}</span></li>`).join('')}</ul></div>`}
function sweep(){let n=0;Object.values(S.clients).forEach(c=>c.docs.forEach(d=>{if(d.s==='Filed'&&-d.rd>S.origDays)n++}));S.swmsg=`${n} original file${n==1?' is':'s are'} past the ${S.origDays}-day limit and ${n==1?'was':'were'} deleted. Fields and text were kept.`;log(`Deleted ${n} original files older than ${S.origDays} days`);draw()}
function patPrev(){const c=S.clients.okafor,d=c.docs[0];const el=document.getElementById('patx');if(el)el.textContent=descName(c,d)}
function tamper(){if(S.tamper){S.chain[1].m=S.chain[1].m0;S.tamper=false}else{S.chain[1].m=S.chain[1].m0.replace('(61% sure)','(96% sure)');S.tamper=true}S.verified=null;draw()}
function toggleAcc(i,k,on){const u=S.users[i];u.ids=u.ids.filter(x=>x!==k);if(on)u.ids.push(k);log(`Owner changed client access for ${u.name}`);draw()}
function testMail(){const v=$('#tm').value.trim();$('#tme').innerHTML=/^\S+@\S+\.\S+$/.test(v)?`<div class="note good">Demo only: nothing was sent. The real app sends a test message to ${esc(v)} through your SMTP server and tells you if it fails.</div>`:'<div class="note err">Enter an email address to send the test to.</div>'}
function purge(){const d=+$('#pd').value;if(!$('#pc').checked){S.pmsg='<div class="note err">Tick the box to confirm first.</div>';draw();return}let n=0;Object.values(S.clients).forEach(c=>{const b=c.docs.length;c.docs=c.docs.filter(x=>-x.rd<=d);n+=b-c.docs.length});S.pmsg=`<div class="note good">${n} document${n==1?'':'s'} older than ${d} days deleted.</div>`;log(`${S.user.name} purged documents older than ${d} days (${n})`);draw()}
function loadSample(){if(S.clients.samplepat){S.smsg='The sample client is already loaded.';draw();return}S.clients.samplepat={name:'Sample, Pat (sample data)',email:'pat@example.com',pol:['Auto'],days:60,req:["Driver's license","Proof of prior insurance"],skip:{},keep:{},sentN:0,links:[],docs:[{t:"Driver's license",rd:-3,s:'Filed',c:95,src:'staff',fn:'sample license.pdf',moved:false,f:{name:'Pat Sample',state:'MA'}}],qa:[],contacts:['pat@example.com']};S.smsg='Sample client added. Find it under Clients.';log(S.user.name+' loaded sample data');draw()}
function resetPw(i){const u=S.users[i],tmp='Temp-'+Math.random().toString(36).slice(2,10)+'-Pw1';u.pw=tmp;log('Owner reset the password for '+u.name);S.flash=`Temporary password for ${u.name}: ${tmp}. They must change it at next sign-in.`;draw()}
function addUser(){const name=$('#nn').value.trim(),email=$('#ne').value.trim().toLowerCase(),pw=$('#np').value,m=t=>$('#uerr').innerHTML=`<div class="note err">${t}</div>`;
 if(S.users.length>=profCap())return m('Your plan is full.');if(!name||!/^\S+@\S+\.\S+$/.test(email))return m('Enter a name and a valid email.');
 if(pw.length<12)return m('The temporary password needs at least 12 characters.');if(S.users.some(u=>u.email===email))return m('That email already has a profile.');
 S.users.push({name,email,pw,role:'staff',mfa:false,backup:[],all:false,ids:[]});log('Owner added staff profile for '+name);draw()}
function rmUser(i){const u=S.users[i];if(!u||u.role==='admin')return;S.users.splice(i,1);S.editU=null;log('Owner removed the profile for '+u.name);draw()}
// ---- account ----
function account(){const u=S.user;
 return `<h1>Account</h1><p class="sub">${esc(u.name)} · ${esc(u.email)}</p>
 ${S.flash?`<div class="note good">${esc(S.flash)}</div>`:''}${S.requireMfa&&!u.mfa?'<div class="note">Your owner requires two-factor sign-in. Set it up below to continue.</div>':''}
 <h2>Change password</h2><div class="card"><p><label for="cp0">Current password</label><br><input type="password" id="cp0" autocomplete="current-password"></p><p><label for="cp1">New password (12+ characters)</label><br><input type="password" id="cp1" autocomplete="new-password"></p><p><label for="cp2">Repeat new password</label><br><input type="password" id="cp2" autocomplete="new-password"></p><div id="cpe"></div><button class="btn" onclick="chPw()">Change password</button></div>
 <h2>Two-factor sign-in</h2><div class="card">${u.mfa?`<p><span class="chip ok">On</span> You will be asked for a code from your authenticator app each time you sign in.</p><p class="sub">${(u.backup||[]).length} recovery code${(u.backup||[]).length==1?'':'s'} left.</p><p><label for="offpw">Password, to turn it off or to get new recovery codes</label><br><input type="password" id="offpw" autocomplete="current-password"></p><div id="offe"></div><button class="btn ghost sm" onclick="turnOff()">Turn off</button> <button class="btn ghost sm" onclick="newBackup()">Get new recovery codes</button>`:S.mfaSetup?`<p>Scan the code in your authenticator app, or type this key in: <b>JBSWY3DPEHPK3PXP</b> (demo key). Then enter the 6-digit code it shows. In this demo, use <b>123456</b>.</p><div class="row"><input type="text" id="mc" inputmode="numeric" maxlength="6" placeholder="6-digit code" aria-label="Authenticator code"><button class="btn" onclick="enrol()">Confirm</button></div><div id="mce"></div>`:`<p><span class="chip warn">Off</span> Add a second step to sign-in.</p><button class="btn" onclick="S.mfaSetup=true;draw()">Set up two-factor</button>`}
 ${S.codes?`<div class="note">Save these recovery codes now. Each works once if you lose your phone.</div><pre>${S.codes.join('\n')}</pre>`:''}</div>`}
function newBackup(){const u=S.user;if($('#offpw').value!==u.pw){$('#offe').innerHTML='<div class="note err">That password is not right.</div>';return}u.backup=mk();S.codes=u.backup.slice();log(u.name+' made new recovery codes');S.flash='New recovery codes made. The old ones no longer work.';draw()}
function turnOff(){const u=S.user;if($('#offpw').value!==u.pw){$('#offe').innerHTML='<div class="note err">That password is not right.</div>';return}u.mfa=false;u.backup=[];S.codes=null;log(u.name+' turned off two-factor');S.flash='Two-factor is off.';draw()}
function chPw(){const u=S.user,m=t=>$('#cpe').innerHTML=`<div class="note err">${t}</div>`,a=$('#cp0').value,b=$('#cp1').value,c=$('#cp2').value;
 if(a!==u.pw)return m('The current password is wrong.');if(b.length<12)return m('The new password needs at least 12 characters.');if(b!==c)return m("The two new passwords don't match.");if(b===a)return m('Choose a password different from the current one.');
 u.pw=b;log(u.name+' changed their password');S.flash='Password changed.';draw()}
function enrol(){const c=$('#mc').value.trim();if(c!=='123456'){$('#mce').innerHTML='<div class="note err">That code is not right. Check the time on your phone and try again.</div>';return}
 S.user.mfa=true;S.mfaSetup=false;S.codes=mk();S.user.backup=S.codes.slice();log(S.user.name+' turned on two-factor');S.flash='Two-factor is on.';draw()}

function calc(){const v=i=>Math.max(0,parseFloat(document.getElementById(i).value)||0),docs=v('r1'),h=docs*Math.max(0,v('r2')-v('r3'))/60,val=h*v('r4'),pl=PLANS.find(p=>docs<=p.cap);
 $('#ro1').textContent=(Math.round(h*10)/10).toLocaleString('en-US')+' hours';$('#ro2').textContent=money(val);
 if(!pl){$('#ro3').textContent='Custom';$('#ro4').textContent="Let's talk";$('#ro5').textContent='n/a';$('#ro6').textContent='That volume is above Plus. Ask for custom pricing.';return}
 const net=val-pl.p;$('#ro3').textContent=pl.n;$('#ro4').textContent=money(pl.p);$('#ro5').textContent=money(net);
 $('#ro6').textContent=h<=0?'With these numbers Deskfile would not save time. Check the minutes.':net<0?'At these numbers the plan costs more than the time it frees. Time a few real documents.':'An estimate from your own numbers, not a promise.'}
function landing(){return `<div class="land"><div class="top"><div class="brand"><span>Deskfile</span></div><button class="btn" onclick="S.page='login';draw()">Try the demo</button></div>
<div class="hero2"><div><h1>Your team's hours go to clients, not to renaming attachments.</h1><p class="lead">Deskfile reads the paperwork your clients send, files it under the right client and policy, and shows what's still missing. You review only what it isn't sure about.</p>
<div class="row"><button class="btn big" onclick="S.page='login';draw()">Try the demo</button><a class="btn big ghost" href="#pricing">See pricing</a></div></div>
<div class="pilot"><h3>Try it free for 7 days</h3><p style="margin:8px 0 0">Pick a plan and upload up to 100 of your own documents. We email you 2 days before the trial ends. Cancel before it ends and you pay nothing.</p></div></div>
<h2 style="margin-top:20px">What happens to each document</h2>
<div class="grid3" style="margin-top:14px"><div class="step"><h3>It arrives</h3><p>Staff upload files, clients use a private upload link, or documents are emailed in. Photos, scans and PDFs all work.</p></div><div class="step"><h3>It gets recognized</h3><p>Deskfile identifies the type, reads the key fields and matches it to a client. It shows how sure it is.</p></div><div class="step"><h3>It gets filed or reviewed</h3><p>Clear matches are filed with a proper name. Anything unsure waits for a person.</p></div><div class="step"><h3>It moves to your system</h3><p>Download the named files or copy the ready note, then tick it off. Deskfile works beside your current software.</p></div></div>
<h2 id="calc">What would it save your agency?</h2><p class="sub">Use your own numbers. Time how long your team really takes to file one document and enter it here.</p>
<div class="roi card" style="margin-top:14px"><div><div class="f2"><label for="r1">Documents handled per month</label><input type="number" id="r1" value="1000" min="0" step="10" oninput="calc()"></div><div class="f2"><label for="r2">Minutes to handle one document today <span class="hint">open, identify, name, file, key in</span></label><input type="number" id="r2" value="5" min="0" step="0.5" oninput="calc()"></div><div class="f2"><label for="r3">Minutes per document with Deskfile <span class="hint">quick review plus moving the file</span></label><input type="number" id="r3" value="1.5" min="0" step="0.5" oninput="calc()"></div><div class="f2"><label for="r4">Staff cost per hour, with payroll costs ($)</label><input type="number" id="r4" value="28" min="0" step="1" oninput="calc()"></div></div>
<div class="out"><span>Staff time freed per month</span><b class="big2" id="ro1"></b><dl><dt>Value of that time</dt><dd id="ro2"></dd><dt>Matching plan</dt><dd id="ro3"></dd><dt>Plan price per month</dt><dd id="ro4"></dd><dt>Left over after the plan</dt><dd id="ro5"></dd></dl><div class="fine" id="ro6" style="color:inherit;opacity:.9"></div></div></div>
<h2 id="pricing">Simple monthly plans</h2><p class="sub">Every plan starts with 7 days free and 100 uploads. We email you 2 days before the trial ends, and you can cancel before then. Founders' offers for the first agencies: 3 months at 15% off, or the annual plan with a month free.</p>
<div class="plans" style="margin-top:14px"><div class="plan"><h3>Starter</h3><div class="price">$500<small> / month</small></div><div class="sub">Up to 400 documents a month</div><ul><li>5 staff profiles</li><li>Sorting, naming, matching</li><li>Review list and client upload links</li><li>Founders: 3 months for about $1,275</li></ul></div>
<div class="plan"><h3>Standard</h3><div class="price">$750<small> / month</small></div><div class="sub">Up to 700 documents a month</div><ul><li>10 staff profiles</li><li>Everything in Starter</li><li>Missing-document reminders and email intake</li><li>Founders: 3 months for about $1,900</li></ul></div>
<div class="plan feat"><h3>Plus</h3><div class="price">$950<small> / month</small></div><div class="sub">Up to 1,200 documents a month</div><ul><li>15 staff profiles</li><li>Everything in Standard</li><li>Priority setup help</li><li>Founders: 3 months for about $2,425, or $10,500 a year (a month free)</li></ul></div></div>
<p class="fine">Prices are planned and may change before launch. Founders' offers are limited to the first agencies.</p>
<h2>Your data</h2><div class="grid3" style="margin-top:14px"><div class="tile"><h3>Encrypted when stored</h3><p>Document text, fields, file names and stored originals are encrypted.</p></div><div class="tile"><h3>Sensitive numbers masked</h3><p>Social Security, card and license numbers are masked before text goes to the AI model.</p></div><div class="tile"><h3>Originals deleted automatically</h3><p>Stored original files are deleted 30 days after filing (you can change the number). Extracted fields and searchable text stay. Everything can be exported or deleted on request.</p></div><div class="tile"><h3>Every action is logged</h3><p>A tamper-evident log shows who viewed, downloaded and exported what.</p></div><div class="tile"><h3>Unsure goes to a person</h3><p>Low-confidence documents wait in a review list. Nothing is filed silently.</p></div><div class="tile"><h3>An early product</h3><p>No independent security audit or certification yet. A one-page security summary is available on request.</p></div></div>
<h2>What it never does</h2><div class="card"><ul style="margin:0;padding-left:1.1rem;color:var(--muted)"><li>Quote, bind or change a policy</li><li>Give coverage advice</li><li>Replace your management system</li></ul></div>
<h2>Questions agencies ask</h2>
<details class="faq"><summary>Do I have to switch software?</summary><p>No. Deskfile works beside your current system. You move the named files and notes across, and tick them off as moved.</p></details>
<details class="faq"><summary>What if it files a document under the wrong client?</summary><p>Unsure matches go to the review list. Every document shows how sure Deskfile was, and any document can be moved to another client in one click. The log records it.</p></details>
<details class="faq"><summary>Where does the document text go?</summary><p>It is processed by Google's Gemini service. Sensitive numbers are masked first, and names and policy details can still be in the text. Ask for the one-page summary for the full picture.</p></details>
<details class="faq"><summary>What does the trial cost?</summary><p>Nothing for the first 7 days. You pick a plan and enter a card. We email you 2 days before the trial ends, and if you cancel before it ends you are not charged. After that it is billed monthly unless you choose one of the discounted plans.</p></details>
<details class="faq"><summary>How long are my original files kept?</summary><p>Stored original files are deleted 30 days after they are filed. The fields Deskfile read and the searchable text stay, so the client file keeps working. You can change the number of days.</p></details>
<div class="cta2"><h2 style="margin:0 0 10px">Look around the demo</h2><p>Every screen uses made-up clients. Sign in with the demo login shown on the next page.</p><button class="btn big" onclick="S.page='login';draw()">Try the demo</button></div>
<p class="fine">Example names and documents on this page are fictional.</p></div>`}
function login(){
 if(S.reset==='ask')return resetAsk();if(S.reset==='new')return resetNew();
 if(S.pending){return `<div class="card" style="max-width:460px;margin:30px auto"><h1>Two-factor code</h1><p class="sub">Open your authenticator app and enter the 6-digit code. Lost your phone? Use a recovery code instead. Demo code: <b>123456</b></p><p><label for="mfa">Code</label><br><input type="text" id="mfa" inputmode="numeric" maxlength="6" autocomplete="one-time-code" onkeydown="if(event.key==='Enter')doCode()"></p><div id="lerr"></div><button class="btn" onclick="doCode()">Verify and sign in</button> <button class="btn ghost" onclick="S.pending=null;draw()">Start over</button></div>`}
 const o=S.lrole==='admin',k="onkeydown=\"if(event.key==='Enter')doLogin()\"";
 return `<div class="card" style="max-width:460px;margin:30px auto"><button class="link back" onclick="S.page='landing';draw()">Back to home</button><h1>Sign in</h1>
<div class="tabs" style="margin-top:16px"><button aria-pressed="${o}" onclick="S.lrole='admin';draw()">Owner</button><button aria-pressed="${!o}" onclick="S.lrole='staff';draw()">Staff</button></div>
<p class="sub">${o?'For the agency owner. You manage profiles and settings.':'For agency staff. Your owner creates your profile.'}</p>
<p><label for="em">Email</label><br><input type="email" id="em" autocomplete="username" ${k}></p><p><label for="pw">Password</label><br><input type="password" id="pw" autocomplete="current-password" ${k}></p>
<div id="lerr">${S.loginNote||''}</div><button class="btn" onclick="doLogin()">Sign in as ${o?'owner':'staff'}</button> <button class="link" style="margin-left:12px" onclick="S.reset='ask';S.resetMsg=null;draw()">Forgot password?</button>
<p class="sub" style="margin-top:14px">Demo login (made-up, no real security): ${o?'dana@agency.example / owner-demo-1234. The owner account asks for a code too.':'sam@agency.example / staff-demo-1234. Sam sees two clients only. priya@agency.example sees all.'}</p></div>`}
function doLogin(){S.loginNote=null;const e=$('#em').value.trim().toLowerCase(),u=S.users.find(x=>x.email===e&&x.pw===$('#pw').value),m=t=>$('#lerr').innerHTML=`<div class="note err">${t}</div>`;
 if(!u)return m("That email and password don't match. Check them and try again.");
 if(u.role!==S.lrole)return m(`This is ${u.role==='admin'?'an owner':'a staff'} profile. Use the ${u.role==='admin'?'Owner':'Staff'} tab.`);
 if(u.mfa){S.pending=u;draw();return}finish(u)}
function doCode(){const c=$('#mfa').value.replace(/\s/g,'').toLowerCase(),u=S.pending;
 if(c==='123456'){S.pending=null;finish(u);return}
 const i=(u.backup||[]).indexOf(c);if(i>-1){u.backup.splice(i,1);log(u.name+' used a recovery code');S.pending=null;finish(u);return}
 $('#lerr').innerHTML='<div class="note err">That code is not right. Codes change every 30 seconds, so enter the newest one.</div>'}
function resetAsk(){return `<div class="card" style="max-width:460px;margin:30px auto"><button class="link back" onclick="S.reset=null;draw()">Back to sign in</button><h1>Reset password</h1>
<p class="sub">Enter your email. If it has a profile, we'll send a link to choose a new password. The link works once and expires in 30 minutes. Check spam if it does not arrive.</p>
<p><label for="rem">Email</label><br><input type="email" id="rem"></p><div id="rerr">${S.resetMsg||''}</div><button class="btn" onclick="doReset()">Send reset link</button></div>`}
function doReset(){const e=$('#rem').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e)){$('#rerr').innerHTML='<div class="note err">Enter a valid email address.</div>';return}
 S.resetEmail=S.users.find(u=>u.email===e)?e:null;log('Password reset requested');
 $('#rerr').innerHTML='<div class="note good">If that email has a profile, a reset link is on its way. It works once and expires in 30 minutes.</div>'+(S.resetEmail?'<p class="sub" style="margin-top:10px">Demo only: in the real app the link arrives by email. <button class="link" onclick="S.reset=\'new\';draw()">Open the emailed link</button></p>':'')}
function resetNew(){return `<div class="card" style="max-width:460px;margin:30px auto"><h1>Choose a new password</h1><p><label for="np1">New password (12+ characters)</label><br><input type="password" id="np1" autocomplete="new-password"></p><p><label for="np2">New password again</label><br><input type="password" id="np2" autocomplete="new-password"></p><div id="nperr"></div><button class="btn" onclick="doNew()">Save new password</button><p class="sub" style="margin-top:10px">Two-factor sign-in stays on, so the link alone is never enough to sign in.</p></div>`}
function doNew(){const a=$('#np1').value,b=$('#np2').value,m=t=>$('#nperr').innerHTML=`<div class="note err">${t}</div>`;if(a.length<12)return m('Use at least 12 characters.');if(a!==b)return m("The two passwords don't match.");
 const u=S.users.find(x=>x.email===S.resetEmail);if(!u)return m('This link has expired or was already used. Ask for a new one.');u.pw=a;S.resetEmail=null;log(u.name+' chose a new password using an emailed link');S.reset=null;S.loginNote='<div class="note good">Password changed. You can sign in now.</div>';draw()}
function finish(u){S.user=u;S.view=S.requireMfa&&!u.mfa?'account':'today';S.flash=null;log(u.name+' signed in');draw();window.scrollTo(0,0)}
function logout(){S.user=null;S.cid=null;S.page='landing';S.flash=null;draw()}
document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>nav(b.dataset.v));
draw();
